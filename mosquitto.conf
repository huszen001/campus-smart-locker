# 校园智能寄存柜 —— Mosquitto 配置（手动从项目目录跑 broker 时用）
#
# Mosquitto 2.x 装完默认只绑 127.0.0.1 且禁止匿名，ESP32 连不上。
# 这里绑全网卡，并且要求用户名 + 密码。
listener 1883 0.0.0.0
allow_anonymous false
password_file C:\Program Files\Mosquitto\passwd

# 账号用 mosquitto_passwd 建/改：
#   "C:\Program Files\Mosquitto\mosquitto_passwd.exe" -c -b <passwd文件> <用户名> <密码>
#
# ⚠️ 建完必须给服务账户授权读，否则服务启动后秒退（net start 却报"启动成功"）：
#   icacls "<passwd文件>" /grant *S-1-5-18:(R)      # S-1-5-18 = NT AUTHORITY\SYSTEM
#   原因：mosquitto_passwd 建的文件只给运行它的用户读，而服务跑在 LocalSystem 下。
#
# 改完要同步三处：backend/app.py 的 MQTT_USER/MQTT_PASS（或环境变量）、
# device_sim.py 同名的环境变量、firmware/campus_locker.ino 顶部的 MQTT_USER/MQTT_PASS。
