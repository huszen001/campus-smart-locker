<!doctype html><html><head><meta charset="utf-8"><style>

  :root{
    --ink:#1E293B; --sub:#475569; --mute:#64748B; --line:#CBD5E1;
    --p1:#2563EB; --p1f:#EFF6FF; --p1b:#BFDBFE;
    --p2:#0D9488; --p2f:#ECFDF5; --p2b:#99F6E4;
    --p3:#7C3AED; --p3f:#F5F3FF; --p3b:#DDD6FE;
    --p4:#EA580C; --p4f:#FFF7ED; --p4b:#FED7AA;
    --p5:#DB2777; --p5f:#FDF2F8; --p5b:#FBCFE8;
  }
  *{box-sizing:border-box}
  body{margin:0; padding:32px 24px 64px; background:#F1F5F9; color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC",sans-serif;}
  header{max-width:1360px; margin:0 auto 28px;}
  header h1{font-size:24px; margin:0 0 8px; letter-spacing:.5px;}
  header p{margin:0; color:var(--mute); font-size:13.5px;}
  header .meta{margin:10px 0 0; font-size:12.5px; color:var(--mute); line-height:1.8}
  main{max-width:1360px; margin:0 auto;}
  .fig{background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px 22px 16px; margin:0 0 28px; box-shadow:0 1px 3px rgba(15,23,42,.06);}
  .fig h2{font-size:16px; margin:0 0 4px; letter-spacing:.5px;}
  .fig .cap{font-size:12.5px; color:var(--mute); margin:0 0 14px; line-height:1.7;}
  .fig svg{width:100%; height:auto; display:block;}
  .note{font-size:12.5px; color:var(--sub); line-height:1.85; margin:14px 0 0; padding:12px 16px; background:#F8FAFC; border-left:3px solid var(--line); border-radius:0 8px 8px 0;}
  .note b{color:var(--ink);}
  .note ul{margin:8px 0 0; padding-left:20px}
  .note li{margin:4px 0}
  .warn{background:#FEF2F2; border-left-color:#FCA5A5}
  .warn b{color:#B91C1C}

  svg text{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC",sans-serif;}
  .sub-line{font-size:12.5px; fill:#64748B}
  .grp-t{font-size:12.5px; font-weight:700}
  .lb{font-size:10.5px; fill:#64748B}
  .lb2{font-size:9.5px; fill:#64748B}
  .nt{font-size:12.5px; font-weight:700}
  .nts{font-size:11.5px; font-weight:700}
  .nb{font-size:10px; fill:#475569}
  .nbs{font-size:9.5px; fill:#475569}
  .mt{font-size:11.5px; font-weight:700}
  .todo{font-size:10px; fill:#334155}
  .layer-t{font-size:14px; font-weight:700; fill:#FFFFFF}
  .word{font-size:10px; fill:#334155}
  .smt{font-size:9px; fill:#64748B}

  @media print{
    body{background:#fff; padding:0; margin:0}
    header{padding:0 0 10px}
    .fig{border:none; box-shadow:none; border-radius:0; padding:0; margin:0; page-break-after:always}
    .fig:last-child{page-break-after:auto}
    .note{background:#fff}
    @page{size:A4 landscape; margin:10mm}
  }

html,body{margin:0;padding:0;background:#fff;}
svg{display:block;width:940.0px;height:470.0px;}
</style></head><body><svg viewBox="0 0 940 470" role="img" aria-label="订单状态机">

    <text class="sub-line" x="60" y="40">一条订单从下发开门命令到落库的一生；两条红线是兜底超时</text>

    <!-- 起始 -->
    <circle cx="70" cy="150" r="7" fill="#DB2777"/>
    <line x1="80" y1="150" x2="132" y2="150" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#a-g)"/>
    <text class="smt" x="70" y="128" text-anchor="middle" fill="#64748B">/api/open</text>
    <text class="smt" x="70" y="112" text-anchor="middle" fill="#64748B">通过授权</text>

    <!-- pending -->
    <rect x="140" y="110" width="180" height="80" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text class="nt" x="230" y="144" text-anchor="middle" fill="#C2410C">pending</text>
    <text class="nbs" x="230" y="166" text-anchor="middle">已下发开门命令</text>
    <text class="nbs" x="230" y="182" text-anchor="middle">等设备确认</text>

    <!-- pending -> opened -->
    <line x1="320" y1="150" x2="392" y2="150" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#a-g)"/>
    <text class="smt" x="356" y="140" text-anchor="middle" fill="#475569">door_opened</text>

    <!-- opened -->
    <rect x="400" y="110" width="180" height="80" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text class="nt" x="490" y="144" text-anchor="middle" fill="#1D4ED8">opened</text>
    <text class="nbs" x="490" y="166" text-anchor="middle">门确实开了</text>
    <text class="nbs" x="490" y="182" text-anchor="middle">等用户关门</text>

    <!-- opened -> done -->
    <line x1="580" y1="150" x2="652" y2="150" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#a-g)"/>
    <text class="smt" x="616" y="140" text-anchor="middle" fill="#475569">door_closed</text>

    <!-- done -->
    <rect x="660" y="110" width="180" height="80" rx="12" fill="#ECFDF5" stroke="#0D9488" stroke-width="2"/>
    <text class="nt" x="750" y="144" text-anchor="middle" fill="#0F766E">done</text>
    <text class="nbs" x="750" y="166" text-anchor="middle">门关上了才算完成</text>
    <text class="nbs" x="750" y="182" text-anchor="middle">存件在此刻生成取件码</text>

    <!-- pending -> failed -->
    <line x1="230" y1="190" x2="230" y2="332" stroke="#DC2626" stroke-width="1.8" marker-end="url(#a-r)"/>
    <text class="smt" x="242" y="246" fill="#DC2626">15 秒没等到 door_opened</text>
    <text class="smt" x="242" y="264" fill="#B91C1C">OPEN_ACK_TIMEOUT</text>

    <!-- opened -> failed -->
    <path d="M490,190 C490,290 410,372 328,372" fill="none" stroke="#DC2626" stroke-width="1.8" marker-end="url(#a-r)"/>
    <text class="smt" x="396" y="272" fill="#DC2626">60 秒没等到 door_closed</text>
    <text class="smt" x="396" y="290" fill="#B91C1C">OPEN_CLOSE_TIMEOUT</text>

    <!-- failed -->
    <rect x="140" y="340" width="180" height="80" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
    <text class="nt" x="230" y="374" text-anchor="middle" fill="#B91C1C">failed</text>
    <text class="nbs" x="230" y="396" text-anchor="middle">超时或下发失败</text>
    <text class="nbs" x="230" y="412" text-anchor="middle">审计里留有原因</text>

    <!-- 说明 -->
    <rect x="400" y="330" width="490" height="100" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="mt" x="416" y="354" fill="#1E293B">三个容易漏掉的地方</text>
    <circle cx="422" cy="376" r="2.4" fill="#EA580C"/>
    <text class="smt" x="434" y="380" fill="#475569">设备离线或 MQTT 发布失败 → 直接判 failed，不让订单干等到超时</text>
    <circle cx="422" cy="396" r="2.4" fill="#EA580C"/>
    <text class="smt" x="434" y="400" fill="#475569">命令先落库再 publish —— 回执可能毫秒级就到，订单必须先有主</text>
    <circle cx="422" cy="416" r="2.4" fill="#EA580C"/>
    <text class="smt" x="434" y="420" fill="#475569">两个阈值都可用环境变量覆盖，演示失败路径时很方便</text>
  </svg></body></html>
